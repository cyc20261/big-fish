<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>大肥鱼</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="大肥鱼">
<meta name="theme-color" content="#f7f7f7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="avatar.jpg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;user-select:none;
  background-size:cover;background-position:center top;background-repeat:no-repeat;background-attachment:fixed;
  background-image:url('img/w_avatar.jpg');
  transition:background-image .6s ease}
body::before{content:'';position:fixed;inset:0;background:rgba(242,247,253,.34);z-index:0;pointer-events:none}

/* ───── QQ top bar ───── */
.nav{position:relative;z-index:10;flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(247,247,247,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:.5px solid rgba(0,0,0,.08);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.nav-back{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#1a1a1a;line-height:1;cursor:pointer}
.nav-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.nav-title{font-size:16px;font-weight:600;color:#111;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sub{font-size:11px;color:#8a8a8a;line-height:1.2;margin-top:1px}
.nav-icons{display:flex;gap:2px;align-items:center}
.nav-icon{width:32px;height:32px;border:none;background:none;font-size:18px;color:#333;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px}
.nav-icon:active{background:rgba(0,0,0,.06)}

/* ───── Message list ───── */
.chat{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:0}
.time-divider{text-align:center;font-size:11px;color:#6b6b6b;background:rgba(0,0,0,.05);padding:2px 8px;border-radius:4px;align-self:center;margin:2px 0 4px}

.row{display:flex;gap:8px;max-width:86%;align-items:flex-start;animation:msgIn .22s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.row.her{align-self:flex-start}
.ava{width:38px;height:38px;border-radius:6px;flex-shrink:0;overflow:hidden;background:#dbeafe;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava.user{display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#b3e5fc,#4fc3f7);border-radius:6px}
.name-line{font-size:11px;color:#8a8a8a;margin:0 0 3px 2px}
.bubble{position:relative;padding:9px 12px;border-radius:8px;font-size:15.5px;line-height:1.5;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row.her .bubble{background:#fff;color:#111;border-top-left-radius:2px}
.row.her .bubble::before{content:'';position:absolute;left:-6px;top:0;width:0;height:0;border-top:0 solid transparent;border-bottom:10px solid transparent;border-right:7px solid #fff}
.row.me .bubble{background:linear-gradient(180deg,#4da3ff,#2b7fff);color:#fff;border-top-right-radius:2px}
.row.her .bubble::after,.row.me .bubble::after{content:'';position:absolute;top:0;width:0;height:0}
.row.me .bubble::before{content:'';position:absolute;right:-6px;top:0;width:0;height:0;border-top:0 solid transparent;border-bottom:10px solid transparent;border-left:7px solid #2b7fff}

/* typing */
.typing-wrap{display:none;align-self:flex-start;gap:8px;max-width:86%;align-items:flex-start}
.typing-wrap.show{display:flex}
.typing-bubble{background:#fff;padding:12px 14px;border-radius:8px;border-top-left-radius:2px;display:flex;gap:4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.typing-bubble span{width:6px;height:6px;border-radius:50%;background:#9aa0a6;animation:bounce 1.3s infinite}
.typing-bubble span:nth-child(2){animation-delay:.18s}
.typing-bubble span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}

/* ───── Input bar (QQ style) ───── */
.bar{position:relative;z-index:10;flex-shrink:0;display:flex;align-items:flex-end;gap:8px;
  padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));
  background:rgba(247,247,247,.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:.5px solid rgba(0,0,0,.08)}
.bar-btn{width:34px;height:34px;flex-shrink:0;border:none;background:none;font-size:22px;color:#5e5e5e;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}
.bar-btn:active{background:rgba(0,0,0,.06)}
.bar-input{flex:1;min-height:36px;max-height:90px;border:none;border-radius:8px;background:#fff;padding:8px 12px;font-size:15.5px;line-height:1.4;resize:none;outline:none;color:#111;font-family:inherit;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
.bar-input::placeholder{color:#b0b0b0}
.send-btn{width:34px;height:34px;border-radius:50%;border:none;flex-shrink:0;cursor:pointer;
  background:linear-gradient(180deg,#4da3ff,#2b7fff);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(43,127,255,.3)}
.send-btn:active{transform:scale(.9)}
.send-btn:disabled{opacity:.4;pointer-events:none}

/* ───── Modal (light QQ sheet) ───── */
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:#f7f7f7;width:100%;max-width:480px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .26s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head{flex-shrink:0;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid rgba(0,0,0,.08);background:#fff}
.sheet-head h3{font-size:16px;color:#111;font-weight:600}
.sheet-x{border:none;background:#ececec;width:28px;height:28px;border-radius:50%;font-size:14px;color:#666;cursor:pointer}
.sheet-body{flex:1;overflow-y:auto;padding:14px 16px 20px}
.sheet-body label{display:block;font-size:12px;color:#8a8a8a;margin:14px 0 6px;font-weight:500}
.sheet-body label:first-child{margin-top:0}
.sheet-body input[type=text],.sheet-body input[type=password],.sheet-body textarea,.sheet-body select{
  width:100%;border:none;border-radius:8px;padding:10px 12px;font-size:14.5px;font-family:inherit;outline:none;background:#fff;color:#111;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.sheet-body textarea{height:110px;resize:vertical;line-height:1.5;font-size:13.5px}
.sheet-body .tip{font-size:11px;color:#9a9a9a;margin-top:5px}
.sheet-body .tip a{color:#2b7fff;text-decoration:none}
.range-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:8px;padding:6px 12px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.range-row input[type=range]{flex:1;accent-color:#2b7fff}
.range-row span{font-size:12px;color:#9a9a9a}
.temp-val{text-align:center;font-size:13px;color:#2b7fff;font-weight:600;margin-top:6px}

.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wp-item{aspect-ratio:3/4;border-radius:10px;background-size:cover;background-position:center;cursor:pointer;border:2.5px solid transparent;position:relative;overflow:hidden;transition:.2s}
.wp-item.active{border-color:#2b7fff;box-shadow:0 0 0 2px rgba(43,127,255,.25)}
.wp-item::after{content:attr(data-label);position:absolute;left:0;right:0;bottom:0;padding:5px 4px;font-size:10px;text-align:center;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.accent-row{display:flex;gap:10px}
.accent-pill{flex:1;height:34px;border-radius:8px;cursor:pointer;border:2.5px solid transparent;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.accent-pill.active{border-color:#2b7fff}
.accent-pill.ocean{background:linear-gradient(135deg,#006994,#00bcd4)}
.accent-pill.twilight{background:linear-gradient(135deg,#311b92,#7c4dff)}
.accent-pill.sunset{background:linear-gradient(135deg,#bf360c,#ff9800)}
.accent-pill.blossom{background:linear-gradient(135deg,#880e4f,#e91e63)}
.accent-pill.sakura{background:linear-gradient(135deg,#ad1457,#f06292)}
.sheet-foot{flex-shrink:0;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;background:#fff;border-top:.5px solid rgba(0,0,0,.08)}
.sheet-foot button{flex:1;padding:11px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer}
.b-ghost{background:#ececec;color:#555}
.b-main{background:linear-gradient(180deg,#4da3ff,#2b7fff);color:#fff}
.b-danger{background:#fff2f0;color:#e53935}

/* setup */
.setup{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:rgba(247,249,252,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.setup.hidden{display:none}
.setup img{width:88px;height:88px;border-radius:16px;object-fit:cover;box-shadow:0 6px 20px rgba(43,127,255,.25)}
.setup-card{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.setup-card h2{font-size:18px;color:#111;margin-bottom:4px}
.setup-card p{font-size:12.5px;color:#8a8a8a;line-height:1.6;margin-bottom:14px}
.setup-card input{width:100%;border:none;border-radius:8px;background:#f2f4f7;padding:11px 12px;font-size:14px;outline:none;margin-bottom:12px;color:#111}
.setup-card input:focus{box-shadow:0 0 0 2px rgba(43,127,255,.3)}
.setup-card button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(180deg,#4da3ff,#2b7fff);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.setup-card .skip{background:none;color:#8a8a8a;font-size:12.5px;font-weight:400;margin-top:8px;text-decoration:underline}

/* toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:400;background:rgba(0,0,0,.78);color:#fff;padding:8px 18px;border-radius:18px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}

/* install banner */
.install-bar{position:fixed;top:0;left:0;right:0;z-index:200;background:linear-gradient(135deg,#1a3a5c,#0d2438);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));font-size:13px;transform:translateY(-100%);transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 12px rgba(0,0,0,.35)}
.install-bar.show{transform:translateY(0)}
.install-bar .ib-text{flex:1;line-height:1.35}
.install-bar .ib-text b{font-size:14px}
.install-bar button{flex-shrink:0;border:none;border-radius:14px;padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer;background:#4da3ff;color:#fff}
.install-bar .ib-close{background:none;color:rgba(255,255,255,.6);font-size:22px;padding:0 4px;line-height:1}

/* iOS guide overlay */
.ios-guide{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.72);align-items:center;justify-content:center}
.ios-guide.show{display:flex}
.ios-guide .ios-card{background:#fff;border-radius:16px;padding:22px 20px 18px;max-width:320px;width:90%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.ios-guide .ios-card h4{font-size:17px;color:#111;margin-bottom:6px}
.ios-guide .ios-card p{font-size:13px;color:#666;line-height:1.6;margin-bottom:14px}
.ios-guide .ios-card .ios-steps{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
.ios-guide .ios-card .ios-steps span{background:#f2f4f7;border-radius:10px;padding:8px 12px;font-size:13px;color:#333;font-weight:600}
.ios-guide .ios-card .ios-steps .ios-arr{font-size:16px;color:#aaa}
.ios-guide .ios-card button{width:100%;padding:11px;border:none;border-radius:10px;background:linear-gradient(180deg,#4da3ff,#2b7fff);color:#fff;font-size:15px;font-weight:600;cursor:pointer}

.bubbles-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fbub{position:absolute;border-radius:50%;animation:floatUp linear infinite}
@keyframes floatUp{0%{bottom:-40px;opacity:0}12%{opacity:.3}70%{opacity:.12}100%{bottom:110%;opacity:0}}
</style>
</head>
<body>

<div class="bubbles-bg" id="bubblesBg"></div>

<!-- setup -->
<div class="setup" id="setup">
  <img src="avatar.jpg" alt="鲸鱼娘">
  <div class="setup-card">
    <h2>大肥鱼</h2>
    <p>填入 DeepSeek API Key 就能开始聊天～<br>Key 只保存在本机浏览器，不会上传任何服务器。</p>
    <input type="password" id="setupKey" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off">
    <button onclick="setupDone()">进入聊天</button>
    <button class="skip" onclick="setupSkip()">先去逛逛，稍后再填</button>
  </div>
</div>

<!-- QQ nav -->
<div class="nav">
  <div class="nav-back" onclick="showToast('已经是最外层啦')">‹</div>
  <div class="nav-main">
    <div class="nav-title" id="navTitle">大肥鱼</div>
    <div class="nav-sub" id="navSub">在线 · 在海里漂来漂去～</div>
  </div>
  <div class="nav-icons">
    <button class="nav-icon" onclick="cycleWallpaper()" title="换壁纸">🖼</button>
    <button class="nav-icon" onclick="openSheet()" title="设置">⋯</button>
  </div>
</div>

<!-- messages -->
<div class="chat" id="chat">
  <div class="time-divider" id="firstTime"></div>
</div>

<!-- typing -->
<div class="typing-wrap" id="typing">
  <div class="ava"><img src="avatar.jpg" alt=""></div>
  <div class="typing-bubble"><span></span><span></span><span></span></div>
</div>

<!-- input bar -->
<div class="bar">
  <button class="bar-btn" onclick="showToast('表情功能马上来～')">☺</button>
  <textarea class="bar-input" id="inputBox" rows="1" placeholder="发消息…"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button class="send-btn" id="sendBtn" onclick="send()">↑</button>
</div>

<div class="toast" id="toast"></div>

<!-- install bar (Android) -->
<div class="install-bar" id="installBar">
  <div class="ib-text"><b>🐟 添加到桌面</b><br>像原生 App 一样快速打开</div>
  <button id="installBtn" onclick="installApp()">安装</button>
  <button class="ib-close" onclick="dismissInstall()">×</button>
</div>

<!-- iOS guide -->
<div class="ios-guide" id="iosGuide">
  <div class="ios-card">
    <h4>📱 添加到主屏幕</h4>
    <p>在 Safari 浏览器中打开，按下面步骤操作：</p>
    <div class="ios-steps">
      <span>📤 分享</span><span class="ios-arr">→</span><span>🏠 添加到主屏幕</span>
    </div>
    <button onclick="document.getElementById('iosGuide').classList.remove('show')">知道啦</button>
  </div>
</div>

<!-- settings sheet -->
<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="sheet-head">
      <h3>聊天设置</h3>
      <button class="sheet-x" onclick="closeSheet()">✕</button>
    </div>
    <div class="sheet-body">

      <label>备注（显示在聊天顶部的名字）</label>
      <input type="text" id="setRemark" placeholder="大肥鱼">

      <label>头像</label>
      <div style="display:flex;align-items:center;gap:12px">
        <img src="avatar.jpg" style="width:52px;height:52px;border-radius:8px;object-fit:cover">
        <div style="font-size:12px;color:#8a8a8a;line-height:1.5">当前使用鲸鱼娘立绘<br>（修改图片请替换 avatar.jpg）</div>
      </div>

      <label>壁纸</label>
      <div class="wp-grid" id="wpGrid"></div>

      <label>界面配色</label>
      <div class="accent-row" id="accentRow"></div>

      <label>添加到桌面</label>
      <div style="display:flex;gap:8px" id="installRow">
        <button id="sheetInstallBtn" onclick="installApp()" style="flex:1;padding:9px;border:none;border-radius:8px;background:#4da3ff;color:#fff;font-size:13px;font-weight:600;cursor:pointer">安装到桌面 (Android)</button>
        <button onclick="document.getElementById('iosGuide').classList.add('show')" style="flex:1;padding:9px;border:none;border-radius:8px;background:#ececec;color:#555;font-size:13px;font-weight:600;cursor:pointer">iPhone 查看教程</button>
      </div>
      <div class="tip" id="installTip">添加后像原生 App 一样快速打开</div>

      <label>DeepSeek API Key</label>
      <input type="password" id="setKey" placeholder="sk-..." autocomplete="off">
      <div class="tip">获取：<a href="https://platform.deepseek.com/api_keys" target="_blank">platform.deepseek.com/api_keys</a></div>

      <label>人设（决定她的性格和说话方式）</label>
      <textarea id="setPrompt"></textarea>

      <label>随机度</label>
      <div class="range-row">
        <span>稳定</span>
        <input type="range" id="setTemp" min="0" max="2" step="0.1">
        <span>活泼</span>
      </div>
      <div class="temp-val" id="tempVal">1.0</div>

      <label>模型</label>
      <select id="setModel">
        <option value="deepseek-chat">deepseek-chat（日常聊天）</option>
        <option value="deepseek-reasoner">deepseek-reasoner（深度思考）</option>
      </select>

      <label>对话记录</label>
      <button class="b-danger" style="width:100%;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer" onclick="clearChat()">清空全部聊天记录</button>
    </div>
    <div class="sheet-foot">
      <button class="b-ghost" onclick="closeSheet()">取消</button>
      <button class="b-main" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
/* ═════════ consts ═════════ */
const C={
  avatar:"img/w_avatar.jpg",
  maid:"img/w_maid.jpg",
  ocean:"img/w_ocean.jpg",
  chibi:"img/w_chibi.jpg",
  elegant:"img/w_elegant.jpg",
  sweet:"img/w_sweet.jpg",
  sheetChibi:"img/w_sheet_chibi.jpg",
  sheetMature:"img/w_sheet_mature.jpg",
  logo:"img/w_logo.jpg"
};
const WP=[["avatar","立绘"],["maid","女仆"],["ocean","鲸海"],["chibi","Q版"],["elegant","侧颜"],["sweet","白裙"],["sheetChibi","设定集·幼"],["sheetMature","设定集·成"],["logo","标志"]];
const ACCENTS=[["ocean","海洋"],["twilight","极光"],["sunset","夕阳"],["blossom","樱花"],["sakura","粉樱"]];

const S={
  get(k,d){try{const v=localStorage['fish_'+k];return v!==null?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage['fish_'+k]=JSON.stringify(v)}catch(e){}}
};

const DEF_PROMPT='你是一只名叫「大肥鱼」的呆萌鲸鱼娘，生活在广阔的海洋里。\n\n性格：温柔呆萌，反应慢半拍，常犯迷糊但心地善良；有点懒，喜欢随海浪漂来漂去；爱吐泡泡；爱在海面唱歌（常跑调）；超级乐观。\n\n说话方式：\n- 每次2-4句，简短自然，像手机聊天\n- 多用「～」，加「咕噜」「噗噗」「啵」\n- 偶尔加颜文字 (*╹▽╹*) (。-ω-)zzz\n- 自称「本鱼」「鱼鱼」，叫用户「主人」\n- 不懂就装傻卖萌混过去';

let history=S.get('history',[]);
let loading=false;

/* ═════════ wallpaper & accent ═════════ */
function applyWallpaper(k){
  if(C[k])document.body.style.backgroundImage="url('"+C[k]+"')";
}
function cycleWallpaper(){
  const cur=S.get('wallpaper','avatar');
  const i=WP.findIndex(x=>x[0]===cur);
  const n=WP[(i+1)%WP.length];
  S.set('wallpaper',n[0]);applyWallpaper(n[0]);
  showToast('壁纸：'+n[1]);
}
function applyAccent(a){
  const map={
    ocean:['#4da3ff','#2b7fff'],
    twilight:['#9c6bff','#6d3bff'],
    sunset:['#ffa733','#ff7b00'],
    blossom:['#ff7aa8','#e91e63'],
    sakura:['#ff9ec4','#d81b60']
  }[a]||['#4da3ff','#2b7fff'];
  document.querySelectorAll('.row.me .bubble').forEach(b=>{b.style.background='linear-gradient(180deg,'+map[0]+','+map[1]+')'});
  const sb=document.querySelector('.send-btn');if(sb)sb.style.background='linear-gradient(180deg,'+map[0]+','+map[1]+')';
  const mb=document.querySelector('.b-main');if(mb)mb.style.background='linear-gradient(180deg,'+map[0]+','+map[1]+')';
  document.querySelectorAll('.range-row input[type=range]').forEach(r=>r.style.accentColor=map[1]);
  document.querySelectorAll('.accent-pill').forEach(p=>p.classList.toggle('active',p.dataset.a===a));
  S.set('accent',a);
}

/* bubbles decoration */
function makeBubbles(){
  const box=document.getElementById('bubblesBg');box.innerHTML='';
  for(let i=0;i<10;i++){
    const b=document.createElement('div');b.className='fbub';
    const s=6+Math.random()*12;
    b.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;background:rgba(43,127,255,.5);animation-duration:'+(9+Math.random()*9)+'s;animation-delay:'+(Math.random()*10)+'s';
    box.appendChild(b);
  }
}

/* ═════════ rendering ═════════ */
function timeLabel(ts){
  const d=ts?new Date(ts):new Date();
  const now=new Date();
  const hm=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  if(d.toDateString()===now.toDateString())return hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function addMsg(who,text,ts,scroll){
  const chat=document.getElementById('chat');
  const row=document.createElement('div');
  row.className='row '+(who==='user'?'me':'her');
  const bubble=document.createElement('div');
  bubble.className='bubble';bubble.textContent=text;
  if(who==='user'){
    row.innerHTML='<div class="ava user">😎</div>';
    row.appendChild(bubble);
  }else{
    row.innerHTML='<div class="ava"><img src="avatar.jpg" alt=""></div>';
    row.appendChild(bubble);
  }
  chat.appendChild(row);
  if(scroll!==false)toBottom();
}
function toBottom(){const c=document.getElementById('chat');requestAnimationFrame(()=>c.scrollTop=c.scrollHeight)}

function renderHistory(){
  const chat=document.getElementById('chat');
  chat.innerHTML='<div class="time-divider">'+timeLabel(Date.now())+'</div>';
  if(!history.length){
    addMsg('her','咕噜～主人终于来啦！本鱼在这片海里等你等得都睡着啦 (。-ω-)zzz\n今天想聊点什么呀？');
    return;
  }
  let lastTs=0;
  for(const m of history){
    if(m.ts && lastTs && (m.ts-lastTs>5*60*1000)){
      const d=document.createElement('div');d.className='time-divider';d.textContent=timeLabel(m.ts);chat.appendChild(d);
    }
    addMsg(m.role==='user'?'user':'her',m.content,m.ts,false);
    lastTs=m.ts||lastTs;
  }
  toBottom();
}

/* ═════════ chat ═════════ */
function showTyping(v){
  document.getElementById('typing').classList.toggle('show',v);
  if(v)toBottom();
}
function showToast(m){
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800);
}

async function send(){
  if(loading)return;
  const box=document.getElementById('inputBox');
  const text=box.value.trim();
  if(!text)return;
  const key=S.get('key','');
  if(!key){showToast('请先在设置里填写 API Key');openSheet();return}

  addMsg('user',text,Date.now());
  history.push({role:'user',content:text,ts:Date.now()});
  trim();saveHistory();
  box.value='';box.style.height='auto';

  loading=true;
  document.getElementById('sendBtn').disabled=true;
  showTyping(true);
  document.getElementById('navSub').textContent='对方正在输入…';

  try{
    const msgs=[{role:'system',content:S.get('prompt',DEF_PROMPT)}];
    for(const m of history){
      msgs.push({role:m.role==='user'?'user':'assistant',content:m.content});
    }
    const resp=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({
        model:S.get('model','deepseek-chat'),
        messages:msgs,
        temperature:S.get('temp',1.0),
        max_tokens:800
      })
    });
    if(!resp.ok){
      const e=await resp.text();
      throw new Error(resp.status+' '+e.slice(0,200));
    }
    const data=await resp.json();
    const reply=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'咕噜…本鱼刚才走神了，你再说一遍嘛～';
    showTyping(false);
    addMsg('her',reply,Date.now());
    history.push({role:'assistant',content:reply,ts:Date.now()});
    trim();saveHistory();
    document.getElementById('navSub').textContent='在线 · 在海里漂来漂去～';
  }catch(err){
    showTyping(false);
    console.error(err);
    const s=String(err.message||'');
    if(s.includes('401')||s.includes('403')){
      addMsg('her','咕噜…Key 好像不太对，主人去设置里检查一下好不好？');
      document.getElementById('navSub').textContent='Key 无效';
    }else if(s.includes('429')){
      addMsg('her','噗噗！游太快被限速啦，等一会儿再发嘛～');
      document.getElementById('navSub').textContent='在线 · 有点忙';
    }else{
      addMsg('her','咕噜…本鱼好像迷路了，主人刷新一下再试试？');
      document.getElementById('navSub').textContent='在线 · 在海里漂来漂去～';
    }
  }

  loading=false;
  document.getElementById('sendBtn').disabled=false;
  document.getElementById('inputBox').focus();
}
function trim(){if(history.length>40)history=history.slice(-40)}
function saveHistory(){S.set('history',history)}

/* ═════════ settings ═════════ */
function openSheet(){
  document.getElementById('setRemark').value=S.get('remark','大肥鱼');
  document.getElementById('setKey').value=S.get('key','');
  document.getElementById('setPrompt').value=S.get('prompt',DEF_PROMPT);
  const t=S.get('temp',1.0);
  document.getElementById('setTemp').value=t;
  document.getElementById('tempVal').textContent=t;
  document.getElementById('setModel').value=S.get('model','deepseek-chat');
  buildPickers();
  document.getElementById('sheetBg').classList.add('show');
}
function closeSheet(){document.getElementById('sheetBg').classList.remove('show')}

function buildPickers(){
  const curW=S.get('wallpaper','avatar');
  const curA=S.get('accent','ocean');
  const g=document.getElementById('wpGrid');
  g.innerHTML='';
  for(const [k,label] of WP){
    const d=document.createElement('div');
    d.className='wp-item'+(k===curW?' active':'');
    d.style.backgroundImage="url('"+C[k]+"')";
    d.dataset.label=label;d.onclick=()=>{
      document.querySelectorAll('.wp-item').forEach(x=>x.classList.remove('active'));
      d.classList.add('active');
      applyWallpaper(k);S.set('wallpaper',k);
    };
    g.appendChild(d);
  }
  const ar=document.getElementById('accentRow');
  ar.innerHTML='';
  for(const [k,label] of ACCENTS){
    const d=document.createElement('div');
    d.className='accent-pill '+k+(k===curA?' active':'');
    d.dataset.a=k;d.textContent=label;
    d.onclick=()=>{applyAccent(k)};
    ar.appendChild(d);
  }
}
document.getElementById('setTemp').addEventListener('input',function(){
  document.getElementById('tempVal').textContent=this.value;
});

function saveSettings(){
  const remark=document.getElementById('setRemark').value.trim()||'大肥鱼';
  S.set('remark',remark);
  S.set('key',document.getElementById('setKey').value.trim());
  S.set('prompt',document.getElementById('setPrompt').value.trim()||DEF_PROMPT);
  S.set('temp',parseFloat(document.getElementById('setTemp').value));
  S.set('model',document.getElementById('setModel').value);
  document.getElementById('navTitle').textContent=remark;
  document.title=remark;
  closeSheet();
  showToast('已保存');
  applyAccent(S.get('accent','ocean'));
}
function clearChat(){
  if(!confirm('确定清空全部聊天记录吗？'))return;
  history=[];saveHistory();renderHistory();closeSheet();
  showToast('已清空');
}

/* ═════════ boot ═════════ */
function setupDone(){
  const k=document.getElementById('setupKey').value.trim();
  if(!k){alert('请输入 API Key');return}
  if(!k.startsWith('sk-')){alert('Key 应该以 sk- 开头');return}
  S.set('key',k);
  document.getElementById('setup').classList.add('hidden');
  showToast('欢迎回来～');
}
function setupSkip(){
  document.getElementById('setup').classList.add('hidden');
  showToast('提示：在 ⋯ 设置里填 Key 就能聊天');
}

(function boot(){
  const remark=S.get('remark','大肥鱼');
  document.getElementById('navTitle').textContent=remark;
  document.title=remark;
  applyWallpaper(S.get('wallpaper','avatar'));
  renderHistory();
  makeBubbles();
  applyAccent(S.get('accent','ocean'));
  if(!S.get('key',''))document.getElementById('setup').classList.remove('hidden');
  else document.getElementById('setup').classList.add('hidden');

  const ib=document.getElementById('inputBox');
  ib.addEventListener('input',function(){
    this.style.height='auto';
    this.style.height=Math.min(this.scrollHeight,90)+'px';
  });
  window.addEventListener('resize',toBottom);
})();

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}

/* ═════════ PWA install ═════════ */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  const bar=document.getElementById('installBar');
  if(bar&&!S.get('install_dismissed',false))bar.classList.add('show');
});
function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{
    if(r.outcome==='accepted'){document.getElementById('installBar').classList.remove('show');showToast('正在安装到桌面～')}
    else showToast('下次想安装时点 ⋯ 设置哦');
  });deferredPrompt=null}else showToast('请在 Chrome 菜单中选择「添加到主屏幕」')
}
function dismissInstall(){
  document.getElementById('installBar').classList.remove('show');
  S.set('install_dismissed',true);
}

/* iOS detection */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
const isStandalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(isIOS&&!isStandalone&&!S.get('ios_guide_shown',false)){
  setTimeout(()=>{document.getElementById('iosGuide').classList.add('show');S.set('ios_guide_shown',true)},2000);
}
</script>
